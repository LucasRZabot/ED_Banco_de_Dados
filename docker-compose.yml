services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-financeiro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financeiro}
      POSTGRES_DB: ${POSTGRES_DB:-financeiro}
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3 local para desenvolvimento (moto). O bucket e o CORS são criados por `npm run s3:setup`.
  s3:
    image: motoserver/moto:5.2.5
    restart: unless-stopped
    ports:
      - "4566:5000"

volumes:
  pgdata:
